[pipeline]
schema_version = 3
direction = "en_ru"
description = "Commercial EN-RU full-finetuning sequence-level distillation pipeline."

[[stages]]
id = "validate_config"
name = "Validate explicit policy, pinned models, paths, and commercial constraints"
runtime = "student"
command = ["scripts/pipeline_v2/data_flow.py", "validate", "--config", "configs/directions/en_ru.toml"]
requires = ["configs/directions/en_ru.toml"]
produces = ["reports/pipeline/en_ru/config_validation.json"]

[[stages]]
id = "build_protected_benchmarks"
name = "Freeze FLORES dev for selection and devtest plus Tatoeba for final evaluation"
runtime = "student"
command = ["scripts/pipeline_v2/build_benchmarks.py", "--config", "configs/directions/en_ru.toml"]
requires = ["configs/directions/en_ru.toml"]
produces = ["data/benchmark/en_ru/flores_dev.parquet", "data/benchmark/en_ru/flores_devtest.parquet", "data/benchmark/en_ru/tatoeba_test.parquet", "reports/pipeline/en_ru/benchmarks.json"]

[[stages]]
id = "build_candidates"
name = "Normalize and deduplicate News Commentary without an arbitrary row cap"
runtime = "student"
command = ["scripts/pipeline_v2/data_flow.py", "candidates", "--config", "configs/directions/en_ru.toml"]
requires = ["data/raw/en_ru/news_commentary.en", "data/raw/en_ru/news_commentary.ru"]
produces = ["data/pipeline_v2/en_ru/candidates.parquet", "reports/pipeline/en_ru/candidates.json"]

[[stages]]
id = "rule_route"
name = "Route HARD_REJECT, NEEDS_QWEN, and AUTO_ACCEPT; sample 500 low-risk audits"
runtime = "student"
command = ["scripts/pipeline_v2/data_flow.py", "rules", "--config", "configs/directions/en_ru.toml"]
requires = ["data/pipeline_v2/en_ru/candidates.parquet", "data/benchmark/en_ru/flores_dev.parquet", "data/benchmark/en_ru/flores_devtest.parquet", "data/benchmark/en_ru/tatoeba_test.parquet"]
produces = ["data/pipeline_v2/en_ru/rule_routed.parquet", "data/pipeline_v2/en_ru/human_review_input.parquet", "reports/pipeline/en_ru/rules.json"]

[[stages]]
id = "judge_human_data"
name = "Judge all NEEDS_QWEN rows and the 500-row AUTO_ACCEPT audit"
runtime = "judge"
command = ["scripts/pipeline_v2/qwen_judge.py", "human", "--config", "configs/directions/en_ru.toml"]
requires = ["data/pipeline_v2/en_ru/human_review_input.parquet"]
produces = ["data/pipeline_v2/en_ru/human_judged.parquet"]

[[stages]]
id = "second_review_human"
name = "Independently re-review only first-pass FAIL and UNCERTAIN human pairs"
runtime = "judge"
command = ["scripts/pipeline_v2/qwen_judge.py", "human_second", "--config", "configs/directions/en_ru.toml"]
requires = ["data/pipeline_v2/en_ru/human_judged.parquet"]
produces = ["data/pipeline_v2/en_ru/human_second_review.parquet"]

[[stages]]
id = "build_approved"
name = "Build GOLD, SILVER, and BRONZE human data from explicit decisions"
runtime = "student"
command = ["scripts/pipeline_v2/data_flow.py", "approve", "--config", "configs/directions/en_ru.toml"]
requires = ["data/pipeline_v2/en_ru/rule_routed.parquet", "data/pipeline_v2/en_ru/human_judged.parquet", "data/pipeline_v2/en_ru/human_second_review.parquet"]
produces = ["data/approved/en_ru/v1/approved_pairs.parquet", "reports/pipeline/en_ru/approved.json"]

[[stages]]
id = "build_frozen_split"
name = "Create pair-, source-, target-, and benchmark-disjoint train validation and test splits"
runtime = "student"
command = ["scripts/pipeline_v2/data_flow.py", "split", "--config", "configs/directions/en_ru.toml"]
requires = ["data/approved/en_ru/v1/approved_pairs.parquet", "data/benchmark/en_ru/flores_dev.parquet", "data/benchmark/en_ru/flores_devtest.parquet", "data/benchmark/en_ru/tatoeba_test.parquet"]
produces = ["data/splits/en_ru/v1/train.jsonl", "data/splits/en_ru/v1/validation.jsonl", "data/splits/en_ru/v1/test.jsonl", "reports/pipeline/en_ru/split.json"]

[[stages]]
id = "prepare_model_candidates"
name = "Verify Hub licenses and materialize every pinned V100-compatible candidate"
runtime = "student"
command = ["scripts/pipeline_v2/prepare_models.py", "--config", "configs/directions/en_ru.toml"]
requires = ["configs/directions/en_ru.toml"]
produces = ["reports/pipeline/en_ru/model_inventory.json"]

[[stages]]
id = "student_bakeoff"
name = "Benchmark every Student candidate on selection-only FLORES dev"
runtime = "student"
command = ["scripts/pipeline_v2/seq2seq_flow.py", "bakeoff", "--role", "student", "--config", "configs/directions/en_ru.toml"]
requires = ["data/benchmark/en_ru/flores_dev.parquet", "reports/pipeline/en_ru/model_inventory.json"]
produces = ["results/model_selection/en_ru/student_scores.json"]

[[stages]]
id = "select_student"
name = "Select the strongest Student independently for EN-RU and RU-EN"
runtime = "student"
command = ["scripts/pipeline_v2/select_model.py", "--role", "student", "--config", "configs/directions/en_ru.toml"]
requires = ["results/model_selection/en_ru/student_scores.json"]
produces = ["results/model_selection/en_ru/selected_student.json"]

[[stages]]
id = "teacher_bakeoff"
name = "Benchmark every Teacher candidate on selection-only FLORES dev"
runtime = "student"
command = ["scripts/pipeline_v2/seq2seq_flow.py", "bakeoff", "--role", "teacher", "--config", "configs/directions/en_ru.toml"]
requires = ["data/benchmark/en_ru/flores_dev.parquet", "reports/pipeline/en_ru/model_inventory.json"]
produces = ["results/model_selection/en_ru/teacher_scores.json"]

[[stages]]
id = "select_teacher"
name = "Select the strongest Teacher independently for EN-RU and RU-EN"
runtime = "student"
command = ["scripts/pipeline_v2/select_model.py", "--role", "teacher", "--config", "configs/directions/en_ru.toml"]
requires = ["results/model_selection/en_ru/teacher_scores.json"]
produces = ["results/model_selection/en_ru/selected_teacher.json"]

[[stages]]
id = "train_exp1"
name = "Full-finetune selected Student; share one bidirectional multilingual model when applicable"
runtime = "student"
command = ["scripts/pipeline_v2/seq2seq_flow.py", "train", "--experiment", "exp1", "--config", "configs/directions/en_ru.toml"]
requires = ["results/model_selection/en_ru/selected_student.json", "data/splits/en_ru/v1/train.jsonl", "data/splits/en_ru/v1/validation.jsonl"]
produces = ["results/student/en_ru/exp1/model_layout.json", "results/student/en_ru/exp1/train_report.json"]

[[stages]]
id = "evaluate_exp1"
name = "Evaluate Exp1 separately on final-only FLORES devtest and Tatoeba"
runtime = "student"
command = ["scripts/pipeline_v2/seq2seq_flow.py", "evaluate", "--experiment", "exp1", "--config", "configs/directions/en_ru.toml"]
requires = ["results/student/en_ru/exp1/model_layout.json", "data/benchmark/en_ru/flores_devtest.parquet", "data/benchmark/en_ru/tatoeba_test.parquet"]
produces = ["results/evaluation/en_ru/exp1/metrics.json"]

[[stages]]
id = "prepare_kd_candidates"
name = "Create bidirectional KD sources with protected-source and duplicate exclusion"
runtime = "student"
command = ["scripts/pipeline_v2/data_flow.py", "kd_candidates", "--config", "configs/directions/en_ru.toml"]
requires = ["data/splits/en_ru/v1/train.jsonl", "data/benchmark/en_ru/flores_dev.parquet", "data/benchmark/en_ru/flores_devtest.parquet", "data/benchmark/en_ru/tatoeba_test.parquet"]
produces = ["data/pipeline_v2/en_ru/kd_candidates.jsonl", "reports/pipeline/en_ru/kd_candidates.json"]

[[stages]]
id = "generate_teacher"
name = "Generate each direction with its independently selected Teacher"
runtime = "student"
command = ["scripts/pipeline_v2/seq2seq_flow.py", "generate_teacher", "--config", "configs/directions/en_ru.toml"]
requires = ["results/model_selection/en_ru/selected_teacher.json", "data/pipeline_v2/en_ru/kd_candidates.jsonl"]
produces = ["data/pipeline_v2/en_ru/teacher_generated.parquet"]

[[stages]]
id = "judge_teacher_calibration"
name = "Audit a deterministic 500-row Teacher calibration sample with Qwen"
runtime = "judge"
command = ["scripts/pipeline_v2/qwen_judge.py", "teacher", "--config", "configs/directions/en_ru.toml", "--calibration"]
requires = ["data/pipeline_v2/en_ru/teacher_generated.parquet"]
produces = ["data/pipeline_v2/en_ru/teacher_judge_calibration.parquet"]

[[stages]]
id = "freeze_teacher_policy"
name = "Freeze PASS plus HIGH or MEDIUM Teacher acceptance policy from calibration audit"
runtime = "student"
command = ["scripts/pipeline_v2/data_flow.py", "teacher_policy", "--config", "configs/directions/en_ru.toml"]
requires = ["data/pipeline_v2/en_ru/teacher_judge_calibration.parquet"]
produces = ["reports/pipeline/en_ru/teacher_judge_policy.json"]

[[stages]]
id = "judge_teacher"
name = "Judge every generated Teacher translation with the frozen schema"
runtime = "judge"
command = ["scripts/pipeline_v2/qwen_judge.py", "teacher", "--config", "configs/directions/en_ru.toml"]
requires = ["data/pipeline_v2/en_ru/teacher_generated.parquet", "reports/pipeline/en_ru/teacher_judge_policy.json"]
produces = ["data/pipeline_v2/en_ru/teacher_judged.parquet"]

[[stages]]
id = "build_kd_dataset"
name = "Build HIGH and MEDIUM weighted KD plus quality-weighted human replay"
runtime = "student"
command = ["scripts/pipeline_v2/data_flow.py", "kd_dataset", "--config", "configs/directions/en_ru.toml"]
requires = ["data/pipeline_v2/en_ru/teacher_judged.parquet", "data/splits/en_ru/v1/train.jsonl", "reports/pipeline/en_ru/teacher_judge_policy.json"]
produces = ["data/distillation/en_ru/v1/train.jsonl", "data/distillation/en_ru/v1/validation.jsonl", "reports/pipeline/en_ru/kd_dataset.json"]

[[stages]]
id = "train_exp2"
name = "Full-finetune Exp1 with approved sequence-level Teacher KD and human replay"
runtime = "student"
command = ["scripts/pipeline_v2/seq2seq_flow.py", "train", "--experiment", "exp2", "--config", "configs/directions/en_ru.toml"]
requires = ["results/student/en_ru/exp1/model_layout.json", "data/distillation/en_ru/v1/train.jsonl", "data/distillation/en_ru/v1/validation.jsonl"]
produces = ["results/student/en_ru/exp2/model_layout.json", "results/student/en_ru/exp2/train_report.json"]

[[stages]]
id = "evaluate_exp2"
name = "Evaluate Exp2 separately on final-only FLORES devtest and Tatoeba"
runtime = "student"
command = ["scripts/pipeline_v2/seq2seq_flow.py", "evaluate", "--experiment", "exp2", "--config", "configs/directions/en_ru.toml"]
requires = ["results/student/en_ru/exp2/model_layout.json", "data/benchmark/en_ru/flores_devtest.parquet", "data/benchmark/en_ru/tatoeba_test.parquet"]
produces = ["results/evaluation/en_ru/exp2/metrics.json"]

[[stages]]
id = "promotion_gate"
name = "Require Exp2 to match or beat Exp1 in both directions and every final benchmark"
runtime = "student"
command = ["scripts/evaluation/check_promotion_gate.py", "--baseline", "results/evaluation/en_ru/exp1/metrics.json", "--candidate", "results/evaluation/en_ru/exp2/metrics.json", "--directions", "en-ru", "ru-en", "--output", "results/evaluation/en_ru/promotion_gate.json"]
requires = ["results/evaluation/en_ru/exp1/metrics.json", "results/evaluation/en_ru/exp2/metrics.json"]
produces = ["results/evaluation/en_ru/promotion_gate.json"]

[[stages]]
id = "freeze"
name = "Atomically freeze the accepted full model while retaining the previous deployment backup"
runtime = "student"
command = ["scripts/pipeline_v2/seq2seq_flow.py", "freeze", "--config", "configs/directions/en_ru.toml"]
requires = ["results/student/en_ru/exp2/model_layout.json", "results/evaluation/en_ru/promotion_gate.json", "models/model_registry.json"]
produces = ["models/final_specialists/en_ru_v1/model_card.json"]

[[stages]]
id = "verify_registry"
name = "Validate registry and deployed paths after promotion"
runtime = "student"
command = ["scripts/inference/check_registry.py"]
requires = ["models/model_registry.json", "models/final_specialists/en_ru_v1/model_card.json"]
produces = ["models/final_specialists/en_ru_v1/model_card.json"]
