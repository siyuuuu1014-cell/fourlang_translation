[pipeline]
schema_version = 4
direction = "uz_ru"
description = "Build audited UZ-RU human and distillation data for the shared four-language model."

[[stages]]
id = "validate_config"
name = "Validate the UZ-RU pair-data contract"
runtime = "student"
command = ["scripts/pipeline_v2/data_flow.py", "validate", "--config", "configs/directions/uz_ru.toml"]
requires = ["configs/directions/uz_ru.toml"]
produces = ["reports/pipeline/uz_ru/config_validation.json"]

[[stages]]
id = "build_protected_benchmarks"
name = "Freeze UZ-RU FLORES selection and final benchmarks"
runtime = "student"
command = ["scripts/pipeline_v2/build_benchmarks.py", "--config", "configs/directions/uz_ru.toml"]
requires = ["configs/directions/uz_ru.toml"]
produces = ["data/benchmark/uz_ru/flores_dev.parquet", "data/benchmark/uz_ru/flores_devtest.parquet", "reports/pipeline/uz_ru/benchmarks.json"]

[[stages]]
id = "download_parallel_data"
name = "Download the pinned UZ-RU OPUS corpora"
runtime = "student"
command = ["scripts/pipeline_v2/opus_parallel.py", "download", "--config", "configs/directions/uz_ru.toml"]
requires = ["configs/directions/uz_ru.toml"]
produces = ["data/raw/uz_ru/opus/GNOME-v1-ru-uz.txt.zip", "data/raw/uz_ru/opus/KDE4-v2-ru-uz.txt.zip", "data/raw/uz_ru/opus/TED2020-v1-ru-uz.txt.zip", "data/raw/uz_ru/opus/QED-v2.0a-ru-uz.txt.zip", "reports/pipeline/uz_ru/opus_downloads.json"]

[[stages]]
id = "build_candidates"
name = "Convert UZ to Latin, merge, and deduplicate"
runtime = "student"
command = ["scripts/pipeline_v2/opus_parallel.py", "build", "--config", "configs/directions/uz_ru.toml"]
requires = ["data/raw/uz_ru/opus/GNOME-v1-ru-uz.txt.zip", "data/raw/uz_ru/opus/KDE4-v2-ru-uz.txt.zip", "data/raw/uz_ru/opus/TED2020-v1-ru-uz.txt.zip", "data/raw/uz_ru/opus/QED-v2.0a-ru-uz.txt.zip"]
produces = ["data/pipeline_v2/uz_ru/candidates.parquet", "reports/pipeline/uz_ru/candidates.json"]

[[stages]]
id = "rule_route"
name = "Rule-route UZ-RU and send only ambiguous rows plus a 500-row audit to Qwen"
runtime = "student"
command = ["scripts/pipeline_v2/data_flow.py", "rules", "--config", "configs/directions/uz_ru.toml"]
requires = ["data/pipeline_v2/uz_ru/candidates.parquet", "data/benchmark/uz_ru/flores_dev.parquet", "data/benchmark/uz_ru/flores_devtest.parquet"]
produces = ["data/pipeline_v2/uz_ru/rule_routed.parquet", "data/pipeline_v2/uz_ru/human_review_input.parquet", "reports/pipeline/uz_ru/rules.json"]

[[stages]]
id = "judge_human_data"
name = "Judge only routed UZ-RU human rows"
runtime = "judge"
command = ["scripts/pipeline_v2/qwen_judge.py", "human", "--config", "configs/directions/uz_ru.toml"]
requires = ["data/pipeline_v2/uz_ru/human_review_input.parquet"]
produces = ["data/pipeline_v2/uz_ru/human_judged.parquet"]

[[stages]]
id = "second_review_human"
name = "Independently re-review only FAIL, UNCERTAIN, or unparseable rows"
runtime = "judge"
command = ["scripts/pipeline_v2/qwen_judge.py", "human_second", "--config", "configs/directions/uz_ru.toml"]
requires = ["data/pipeline_v2/uz_ru/human_judged.parquet"]
produces = ["data/pipeline_v2/uz_ru/human_second_review.parquet"]

[[stages]]
id = "build_approved"
name = "Build explicitly approved UZ-RU human data"
runtime = "student"
command = ["scripts/pipeline_v2/data_flow.py", "approve", "--config", "configs/directions/uz_ru.toml"]
requires = ["data/pipeline_v2/uz_ru/rule_routed.parquet", "data/pipeline_v2/uz_ru/human_judged.parquet", "data/pipeline_v2/uz_ru/human_second_review.parquet"]
produces = ["data/approved/uz_ru/v1/approved_pairs.parquet", "reports/pipeline/uz_ru/approved.json"]

[[stages]]
id = "build_frozen_split"
name = "Create leakage-safe bidirectional UZ-RU train, validation, and test data"
runtime = "student"
command = ["scripts/pipeline_v2/data_flow.py", "split", "--config", "configs/directions/uz_ru.toml"]
requires = ["data/approved/uz_ru/v1/approved_pairs.parquet", "data/benchmark/uz_ru/flores_dev.parquet", "data/benchmark/uz_ru/flores_devtest.parquet"]
produces = ["data/splits/uz_ru/v1/train.jsonl", "data/splits/uz_ru/v1/validation.jsonl", "data/splits/uz_ru/v1/test.jsonl", "reports/pipeline/uz_ru/split.json"]

[[stages]]
id = "prepare_teacher_candidates"
name = "Materialize every pinned UZ-RU Teacher candidate"
runtime = "student"
command = ["scripts/pipeline_v2/prepare_models.py", "--role", "teacher", "--config", "configs/directions/uz_ru.toml"]
requires = ["configs/directions/uz_ru.toml"]
produces = ["reports/pipeline/uz_ru/model_inventory.json"]

[[stages]]
id = "teacher_bakeoff"
name = "Benchmark every UZ-RU Teacher candidate on selection-only FLORES dev"
runtime = "student"
command = ["scripts/pipeline_v2/seq2seq_flow.py", "bakeoff", "--role", "teacher", "--config", "configs/directions/uz_ru.toml"]
requires = ["data/benchmark/uz_ru/flores_dev.parquet", "reports/pipeline/uz_ru/model_inventory.json"]
produces = ["results/model_selection/uz_ru/teacher_scores.json"]

[[stages]]
id = "select_teacher"
name = "Select the strongest Teacher independently for UZ-RU and RU-UZ"
runtime = "student"
command = ["scripts/pipeline_v2/select_model.py", "--role", "teacher", "--config", "configs/directions/uz_ru.toml"]
requires = ["results/model_selection/uz_ru/teacher_scores.json"]
produces = ["results/model_selection/uz_ru/selected_teacher.json"]

[[stages]]
id = "prepare_kd_candidates"
name = "Create protected-source-disjoint bidirectional UZ-RU KD sources"
runtime = "student"
command = ["scripts/pipeline_v2/data_flow.py", "kd_candidates", "--config", "configs/directions/uz_ru.toml"]
requires = ["data/splits/uz_ru/v1/train.jsonl", "data/benchmark/uz_ru/flores_dev.parquet", "data/benchmark/uz_ru/flores_devtest.parquet"]
produces = ["data/pipeline_v2/uz_ru/kd_candidates.jsonl", "reports/pipeline/uz_ru/kd_candidates.json"]

[[stages]]
id = "generate_teacher"
name = "Generate each UZ-RU direction with its independently selected Teacher"
runtime = "student"
command = ["scripts/pipeline_v2/seq2seq_flow.py", "generate_teacher", "--config", "configs/directions/uz_ru.toml"]
requires = ["results/model_selection/uz_ru/selected_teacher.json", "data/pipeline_v2/uz_ru/kd_candidates.jsonl"]
produces = ["data/pipeline_v2/uz_ru/teacher_generated.parquet"]

[[stages]]
id = "judge_teacher_calibration"
name = "Audit a deterministic 500-row UZ-RU Teacher calibration sample"
runtime = "judge"
command = ["scripts/pipeline_v2/qwen_judge.py", "teacher", "--config", "configs/directions/uz_ru.toml", "--calibration"]
requires = ["data/pipeline_v2/uz_ru/teacher_generated.parquet"]
produces = ["data/pipeline_v2/uz_ru/teacher_judge_calibration.parquet"]

[[stages]]
id = "freeze_teacher_policy"
name = "Freeze the UZ-RU Teacher acceptance policy"
runtime = "student"
command = ["scripts/pipeline_v2/data_flow.py", "teacher_policy", "--config", "configs/directions/uz_ru.toml"]
requires = ["data/pipeline_v2/uz_ru/teacher_judge_calibration.parquet"]
produces = ["reports/pipeline/uz_ru/teacher_judge_policy.json"]

[[stages]]
id = "judge_teacher"
name = "Judge generated UZ-RU Teacher translations with the frozen schema"
runtime = "judge"
command = ["scripts/pipeline_v2/qwen_judge.py", "teacher", "--config", "configs/directions/uz_ru.toml"]
requires = ["data/pipeline_v2/uz_ru/teacher_generated.parquet", "reports/pipeline/uz_ru/teacher_judge_policy.json"]
produces = ["data/pipeline_v2/uz_ru/teacher_judged.parquet"]

[[stages]]
id = "build_kd_dataset"
name = "Build approved UZ-RU KD plus human replay for the shared model"
runtime = "student"
command = ["scripts/pipeline_v2/data_flow.py", "kd_dataset", "--config", "configs/directions/uz_ru.toml"]
requires = ["data/pipeline_v2/uz_ru/teacher_judged.parquet", "data/splits/uz_ru/v1/train.jsonl", "reports/pipeline/uz_ru/teacher_judge_policy.json"]
produces = ["data/distillation/uz_ru/v1/train.jsonl", "data/distillation/uz_ru/v1/validation.jsonl", "reports/pipeline/uz_ru/kd_dataset.json"]
