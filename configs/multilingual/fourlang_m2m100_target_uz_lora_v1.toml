[experiment]
schema_version = 1
id = "m2m100_target_uz_lora_v1"
repair_directions = ["en-uz", "zh-uz"]
seed = 2026
minimum_free_disk_gb = 8

[base_model]
path = "results/student/fourlang_m2m100/m2m100_error_replay_v1/best_model/shared"
family = "m2m100"
license = "MIT"

[data]
train = "data/multilingual/fourlang/exp3_v2/train.jsonl"
validation = "data/multilingual/fourlang/exp3_v2/validation.jsonl"

[benchmark]
path = "data/benchmark/fourlang/flores_devtest.parquet"

[baseline]
exp4_metrics = "results/evaluation/fourlang_m2m100/m2m100_error_replay_v1/metrics.json"

[outputs]
adapter = "results/student/fourlang_m2m100/m2m100_target_uz_lora_v1/adapter"
training_report = "results/student/fourlang_m2m100/m2m100_target_uz_lora_v1/train_report.json"
metrics = "results/evaluation/fourlang_m2m100/m2m100_target_uz_lora_v1/metrics.json"
comparison = "results/evaluation/fourlang_m2m100/target_uz_lora_v1_comparison.json"
preflight = "results/student/fourlang_m2m100/target_uz_lora_v1_preflight.json"

[lora]
r = 16
alpha = 32
dropout = 0.05
target_modules = ["q_proj", "v_proj"]

[training]
epochs = 1
learning_rate = 0.00005
batch_size = 8
gradient_accumulation_steps = 4
weight_decay = 0.01
warmup_ratio = 0.05
max_source_length = 256
max_target_length = 256
dataloader_num_workers = 4
optim = "adamw_torch_fused"

[deployment]
num_beams = 5
max_new_tokens = 256

[selection]
minimum_zh_uz_recovery_from_exp4 = 0.30
maximum_en_uz_regression_from_exp4 = 0.10
minimum_macro_chrf2 = 38.35
minimum_worst_chrf2 = 17.07
