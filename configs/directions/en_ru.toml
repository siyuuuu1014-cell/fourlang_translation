[direction]
schema_version = 2
pair = "en_ru"
source_lang = "en"
target_lang = "ru"
version = "v1"
commercial_use = true
seed = 2026

[data]
source_file = "data/raw/en_ru/news_commentary.en"
target_file = "data/raw/en_ru/news_commentary.ru"
corpus = "News-Commentary"
validation_pairs = 3000
test_pairs = 3000
# Exp1 intentionally uses a deterministic GOLD+SILVER subset instead of every
# approved pair.  This is direction-specific so other language pairs can choose
# a different evidence-based size.
train_pairs = 61216
training_tiers = ["GOLD", "SILVER"]
max_characters = 1000
max_length_ratio = 4.0

[benchmarks]
# The model bake-off may see only FLORES dev. Final promotion may see only
# FLORES devtest and the frozen Tatoeba sample. None may enter training or KD.
flores_url = "https://dl.fbaipublicfiles.com/nllb/flores200_dataset.tar.gz"
tatoeba_url = "https://object.pouta.csc.fi/OPUS-Tatoeba/v2026-07-08/moses/en-ru.txt.zip"
tatoeba_pairs = 2000
flores_source_code = "eng_Latn"
flores_target_code = "rus_Cyrl"
tatoeba_source_suffix = ".en"
tatoeba_target_suffix = ".ru"

[benchmarks.selection]
flores_dev = "data/benchmark/en_ru/flores_dev.parquet"

[benchmarks.final]
flores_devtest = "data/benchmark/en_ru/flores_devtest.parquet"
tatoeba = "data/benchmark/en_ru/tatoeba_test.parquet"

[judge]
model_path = "${FOURLANG_QWEN_MODEL_PATH}"
auto_accept_audit_pairs = 500
teacher_calibration_pairs = 500
batch_size = 32
max_input_tokens = 1536
max_new_tokens = 256

[distillation]
candidate_pairs_per_direction = 10000
# Persist one atomic shard after this many generated rows. Interrupted Teacher
# generation resumes from completed shards instead of restarting from zero.
teacher_checkpoint_rows = 256
human_weight = 1.0
teacher_high_weight = 1.0
teacher_medium_weight = 0.8

[training]
batch_size = 16
gradient_accumulation_steps = 2
weight_decay = 0.01
warmup_ratio = 0.05
max_source_length = 256
max_target_length = 256
early_stopping_patience = 1
gradient_checkpointing = false
group_by_length = true
dataloader_num_workers = 4
optim = "adamw_torch_fused"

[training.exp1]
epochs = 3
learning_rate = 0.00003

[training.exp2]
epochs = 2
learning_rate = 0.000005

[selection]
primary_metric = "chrf2"
secondary_metric = "bleu"
student_override = "small100"
require_both_directions = true
max_student_parameters = 1300000000
select_each_direction_independently = true
share_multilingual_student_when_same_candidate_wins = true

