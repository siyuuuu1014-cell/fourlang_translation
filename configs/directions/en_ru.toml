[direction]
schema_version = 2
pair = "en_ru"
source_lang = "en"
target_lang = "ru"
version = "v1"
commercial_use = true
seed = 2026

[data]
source_file = "data/raw/en_ru/news_commentary.en"
target_file = "data/raw/en_ru/news_commentary.ru"
corpus = "News-Commentary"
candidate_limit = 70000
validation_pairs = 3000
test_pairs = 3000
max_characters = 1000
max_length_ratio = 4.0

[benchmarks]
# Protected evaluation data: never used by human training or KD.
flores = "data/benchmark/en_ru/flores_devtest.parquet"
tatoeba = "data/benchmark/en_ru/tatoeba_test.parquet"
flores_url = "https://dl.fbaipublicfiles.com/nllb/flores200_dataset.tar.gz"
tatoeba_url = "https://object.pouta.csc.fi/OPUS-Tatoeba/v2026-07-08/moses/en-ru.txt.zip"
tatoeba_pairs = 2000
flores_source_code = "eng_Latn"
flores_target_code = "rus_Cyrl"
tatoeba_source_suffix = ".en"
tatoeba_target_suffix = ".ru"

[judge]
model_path = "${FOURLANG_QWEN_MODEL_PATH}"
calibration_pairs = 500
batch_size = 1
max_new_tokens = 160
accept_score_floor = 0.80
accept_quantile = 0.25
teacher_accept_score_floor = 0.85
teacher_accept_quantile = 0.25

[distillation]
candidate_pairs_per_direction = 10000
human_weight = 1.0
teacher_high_weight = 1.0
teacher_medium_weight = 0.8

[training]
epochs = 3
batch_size = 2
gradient_accumulation_steps = 16
learning_rate = 0.00005
weight_decay = 0.01
warmup_ratio = 0.05
max_source_length = 256
max_target_length = 256
early_stopping_patience = 1

[selection]
primary_metric = "chrf2"
secondary_metric = "bleu"
require_both_directions = true
max_student_parameters = 1300000000

[[student_candidates]]
id = "opus_pair"
family = "marian_pair"
license = "mixed_apache2_ccby4"
commercial_allowed = true
attribution_required = true
license_en_ru = "apache-2.0"
license_ru_en = "cc-by-4.0"
en_ru_path = "${FOURLANG_MODEL_ROOT}/opus-mt-en-ru"
ru_en_path = "${FOURLANG_MODEL_ROOT}/opus-mt-ru-en"
en_ru_repo_id = "Helsinki-NLP/opus-mt-en-ru"
ru_en_repo_id = "Helsinki-NLP/opus-mt-ru-en"

[[student_candidates]]
id = "small100"
family = "small100"
license = "mit"
commercial_allowed = true
attribution_required = true
path = "${FOURLANG_MODEL_ROOT}/small100"
repo_id = "alirezamsh/small100"

[[student_candidates]]
id = "m2m100_418m"
family = "m2m100"
license = "mit"
commercial_allowed = true
attribution_required = true
path = "${FOURLANG_MODEL_ROOT}/m2m100_418M"
repo_id = "facebook/m2m100_418M"

[[teacher_candidates]]
id = "madlad400_3b_mt"
family = "madlad"
license = "apache-2.0"
commercial_allowed = true
attribution_required = true
path = "${FOURLANG_MODEL_ROOT}/madlad400-3b-mt"
repo_id = "google/madlad400-3b-mt"

[[teacher_candidates]]
id = "m2m100_1_2b"
family = "m2m100"
license = "mit"
commercial_allowed = true
attribution_required = true
path = "${FOURLANG_MODEL_ROOT}/m2m100_1.2B"
repo_id = "facebook/m2m100_1.2B"

[deployment]
registry = "models/model_registry.json"
destination = "models/final_specialists/en_ru_v1"
model_name = "en_ru_specialist_v1"
num_beams = 5
max_new_tokens = 256
