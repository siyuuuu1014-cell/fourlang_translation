[experiment]
schema_version = 1
id = "m2m100_ru_uz_lora_v1"
repair_direction = "ru-uz"
seed = 2026
minimum_free_disk_gb = 8

[base_model]
path = "results/student/fourlang_m2m100/m2m100_error_replay_v1/best_model/shared"
family = "m2m100"
license = "MIT"

[data]
# Reuse the already-approved targeted corpus, but train only on ru->uz rows.
train = "data/multilingual/fourlang/exp3_v2/train.jsonl"
validation = "data/multilingual/fourlang/exp3_v2/validation.jsonl"

[benchmark]
path = "data/benchmark/fourlang/flores_devtest.parquet"

[baselines]
exp4_metrics = "results/evaluation/fourlang_m2m100/m2m100_error_replay_v1/metrics.json"
targeted_v2_metrics = "results/evaluation/fourlang_m2m100/m2m100_targeted_from_human_v2/metrics.json"

[outputs]
adapter = "results/student/fourlang_m2m100/m2m100_ru_uz_lora_v1/adapter"
training_report = "results/student/fourlang_m2m100/m2m100_ru_uz_lora_v1/train_report.json"
metrics = "results/evaluation/fourlang_m2m100/m2m100_ru_uz_lora_v1/metrics.json"
comparison = "results/evaluation/fourlang_m2m100/ru_uz_lora_v1_comparison.json"
preflight = "results/student/fourlang_m2m100/ru_uz_lora_v1_preflight.json"

[lora]
r = 16
alpha = 32
dropout = 0.05
target_modules = ["q_proj", "v_proj"]

[training]
# Adapter parameters tolerate a much higher LR than full-model fine-tuning.
# One short epoch is deliberate: this is a local direction repair, not Exp5.
epochs = 1
learning_rate = 0.00005
batch_size = 8
gradient_accumulation_steps = 4
weight_decay = 0.01
warmup_ratio = 0.05
max_source_length = 256
max_target_length = 256
dataloader_num_workers = 4
optim = "adamw_torch_fused"

[deployment]
num_beams = 5
max_new_tokens = 256

[selection]
minimum_ru_uz_recovery_from_exp4 = 0.30
minimum_macro_chrf2 = 38.35
minimum_worst_chrf2 = 17.07
