[experiment]
schema_version = 1
id = "fourlang_m2m100_soup_v1"
alphas_exp4 = [0.25, 0.50, 0.75]
minimum_free_disk_gb = 20

[models]
exp4 = "results/student/fourlang_m2m100/m2m100_error_replay_v1/best_model/shared"
targeted_v2 = "results/student/fourlang_m2m100/m2m100_targeted_from_human_v2/best_model/shared"

[metrics]
exp4 = "results/evaluation/fourlang_m2m100/m2m100_error_replay_v1/metrics.json"
targeted_v2 = "results/evaluation/fourlang_m2m100/m2m100_targeted_from_human_v2/metrics.json"

[outputs]
model_root = "results/student/fourlang_m2m100/m2m100_soup_v1"
evaluation_root = "results/evaluation/fourlang_m2m100/m2m100_soup_v1"
comparison = "results/evaluation/fourlang_m2m100/soup_v1_comparison.json"

[benchmark]
path = "data/benchmark/fourlang/flores_devtest.parquet"

[selection]
regression_tolerance = 0.10
regression_sum_penalty = 2.0
maximum_regression_penalty = 3.0
hard_max_direction_regression = 0.20
minimum_ru_uz_recovery_from_exp4 = 0.30
maximum_zh_uz_regression = 0.10
minimum_macro_chrf2 = 38.35
minimum_worst_chrf2 = 17.07

[student]
id = "m2m100_418m"
family = "m2m100"
repo_id = "facebook/m2m100_418M"
revision = "55c2e61bbf05dfb8d7abccdc3fae6fc8512fd636"
license = "MIT"
require_local_artifact = true

[training]
max_source_length = 256
max_target_length = 256

[deployment]
num_beams = 5
max_new_tokens = 256
