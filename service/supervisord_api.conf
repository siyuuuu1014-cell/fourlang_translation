[supervisord]
logfile=/root/autodl-tmp/fourlang_translation/logs/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
pidfile=/tmp/fourlang_supervisord.pid
nodaemon=false

[program:fourlang_api]
command=/root/autodl-tmp/venvs/small100_student/bin/python scripts/service/run_api.py --host 0.0.0.0 --port 8000
directory=/root/autodl-tmp/fourlang_translation
autostart=true
autorestart=true
startretries=5
startsecs=10
redirect_stderr=true
stdout_logfile=/root/autodl-tmp/fourlang_translation/logs/api.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=3
stopasgroup=true
killasgroup=true
