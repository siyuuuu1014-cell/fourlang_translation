[pipeline]
scope = "flores_like_distillation"

[direction]
schema_version = 1
pair = "zh_uz"
source_lang = "zh"
target_lang = "uz"
version = "flores_like_v2"
commercial_use = false
seed = 2026

[artifacts]
pipeline_namespace = "zh_uz_flores_like_v2"
teacher_selection_pair = "zh_uz"

[inputs]
candidate_pool = "data/pipeline_v2/zh_uz_v3/monolingual_collected.parquet"
source_review = "data/pipeline_v2/zh_uz_v3/source_judged.parquet"
previous_selected = "data/pipeline_v2/zh_uz_v3/kd_candidates.jsonl"
existing_train = "data/distillation/zh_uz/v4/train.jsonl"
validation = "data/splits/zh_uz/v2/validation.jsonl"
flores_dev = "data/benchmark/fourlang/flores_dev.parquet"
flores_devtest = "data/benchmark/fourlang/flores_devtest.parquet"
candidate_extensions = [
  "data/pipeline_v2/zh_uz_flores_like_v1/wikipedia_extension.parquet",
]

[outputs]
root = "data/distillation/zh_uz/flores_like_v2"
report_root = "reports/experiments/zh_uz_flores_like_v2"
teacher_pipeline_root = "data/pipeline_v2/zh_uz_flores_like_v2"

[reuse]
source_judged = [
  "data/pipeline_v2/zh_uz_flores_like_v1/source_judged.parquet",
]
teacher_generated = [
  "data/pipeline_v2/zh_uz_flores_like_v1/teacher_generated.parquet",
]
teacher_judged = [
  "data/pipeline_v2/zh_uz_flores_like_v1/teacher_judge_calibration.parquet",
]

[selection]
# Generate a larger pool than the 8k publication minimum so strict review can
# reject weak translations without forcing low-quality backfill.
source_review_candidates_per_direction = 0
candidate_sources_per_direction = 14000
minimum_teacher_rows_per_direction = 8000
near_duplicate_jaccard = 0.80
shingle_size = 5
require_source_qwen_pass = true

# Wikipedia performed best in v1 calibration. Bronze is retained only as a
# one-percent emergency ceiling because zero-valued caps are intentionally
# invalid in the shared selection contract.
[selection.source_caps]
hplt = 0.65
fineweb = 0.45
wikipedia = 0.65
v2_bronze = 0.01
other = 0.10

[extension]
filter_config = "configs/directions/zh_uz_v3.toml"
checkpoint_rows = 250
require_full_targets = true

[[extension.sources]]
id = "wikipedia_flores_like_zh"
kind = "hf_dataset"
language = "zh"
dataset_id = "wikimedia/wikipedia"
subset = "20231101.zh"
split = "train"
text_field = "text"
split_documents = true
target_rows = 15000
max_documents = 250000
license = "cc-by-sa-3.0-and-gfdl"

[[extension.sources]]
id = "wikipedia_flores_like_uz"
kind = "hf_dataset"
language = "uz"
dataset_id = "wikimedia/wikipedia"
subset = "20231101.uz"
split = "train"
text_field = "text"
split_documents = true
target_rows = 8000
max_documents = 150000
license = "cc-by-sa-3.0-and-gfdl"

[mixture]
human = 0.40
existing_kd = 0.30
flores_like_kd = 0.30
direction_share = 0.50

[text_contract]
zh_script = "simplified"
convert_traditional_to_simplified = true
uz_script = "latin"
transliterate_cyrillic_to_latin = true

[benchmarks.selection]
flores_dev = "data/benchmark/fourlang/flores_dev.parquet"

[benchmarks.final]
flores_devtest = "data/benchmark/fourlang/flores_devtest.parquet"

[language_codes.nllb]
zh = "zho_Hans"
uz = "uzn_Latn"

[judge]
model_path = "${FOURLANG_QWEN_MODEL_PATH}"
source_policy = "natural_sentence_entities_allowed_v2"
source_calibration_pairs = 4000
teacher_calibration_pairs = 1000
batch_size = 32
max_input_tokens = 1536
max_new_tokens = 256
# The V100 32GB can hold Qwen3-8B in FP16. Direct placement avoids a transient
# CPU copy under restrictive container memory limits.
model_device = "cuda"

[distillation]
teacher_checkpoint_rows = 256
teacher_high_weight = 1.0
teacher_medium_weight = 0.8
minor_second_review_enabled = true
teacher_minor_high_weight = 0.5
teacher_minor_medium_weight = 0.4

[training]
max_source_length = 256

[deployment]
num_beams = 5
max_new_tokens = 256

[[teacher_candidates]]
id = "nllb200_3_3b"
family = "nllb"
license = "cc-by-nc-4.0"
commercial_allowed = false
attribution_required = true
path = "${FOURLANG_MODEL_ROOT}/nllb-200-3.3B"
repo_id = "facebook/nllb-200-3.3B"
revision = "a2814a8c92847d0d6aaf7afc9eac24ab57f26151"
