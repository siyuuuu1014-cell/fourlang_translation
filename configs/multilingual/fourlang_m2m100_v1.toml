[multilingual]
schema_version = 1
id = "fourlang_m2m100_v1"
languages = ["en", "zh", "uz", "ru"]
seed = 2026

[student]
id = "m2m100_418m"
family = "m2m100"
path = "${FOURLANG_MODEL_ROOT}/m2m100_418M"
repo_id = "facebook/m2m100_418M"
revision = "55c2e61bbf05dfb8d7abccdc3fae6fc8512fd636"
license = "MIT"

[data.kd]
train = "data/multilingual/fourlang/exp2/train.jsonl"
validation = "data/multilingual/fourlang/exp2/validation.jsonl"

[data.targeted]
train = "data/multilingual/fourlang/exp3_v2/train.jsonl"
validation = "data/multilingual/fourlang/exp3_v2/validation.jsonl"

[benchmarks]
flores_devtest = "data/benchmark/fourlang/flores_devtest.parquet"

[outputs]
root = "results/student/fourlang_m2m100"
evaluation_root = "results/evaluation/fourlang_m2m100"

[training]
batch_size = 8
gradient_accumulation_steps = 4
weight_decay = 0.01
warmup_ratio = 0.05
max_source_length = 256
max_target_length = 256
early_stopping_patience = 1
gradient_checkpointing = false
group_by_length = true
dataloader_num_workers = 4
optim = "adamw_torch_fused"

[training.m2m100_kd_v1]
# Fresh M2M100 student: use a normal fine-tuning LR, not the old NLLB repair LR.
epochs = 2
learning_rate = 0.00003
checkpoint_interval_steps = 1000
direction_validation_samples = 200

[training.m2m100_targeted_v1]
# Continue from the best KD checkpoint with the already-built targeted dataset.
epochs = 1
learning_rate = 0.000005
checkpoint_interval_steps = 500
direction_validation_samples = 200

[training_by_family.m2m100]
batch_size = 8
gradient_accumulation_steps = 4

[deployment]
num_beams = 5
max_new_tokens = 256

