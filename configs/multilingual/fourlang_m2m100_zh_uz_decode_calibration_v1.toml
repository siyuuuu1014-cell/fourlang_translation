[experiment]
schema_version = 1
id = "m2m100_zh_uz_decode_calibration_v1"
direction = "zh-uz"

[model]
config = "configs/multilingual/fourlang_m2m100_zh_uz_lora_v1.toml"

[data]
# Parameter selection uses only this validation split, never FLORES devtest.
validation = "data/multilingual/fourlang/exp3_v2/validation.jsonl"

[benchmark]
path = "data/benchmark/fourlang/flores_devtest.parquet"

[baseline]
exp4_metrics = "results/evaluation/fourlang_m2m100/m2m100_error_replay_v1/metrics.json"

[outputs]
calibration = "results/evaluation/fourlang_m2m100/m2m100_zh_uz_decode_calibration_v1/calibration.json"
metrics = "results/evaluation/fourlang_m2m100/m2m100_zh_uz_decode_calibration_v1/metrics.json"
comparison = "results/evaluation/fourlang_m2m100/zh_uz_decode_calibration_v1_comparison.json"

[decoding]
max_source_length = 256
max_new_tokens = 256
batch_size = 8
candidates = [
  { id = "greedy", num_beams = 1, length_penalty = 1.0, early_stopping = false },
  { id = "beam3_lp080", num_beams = 3, length_penalty = 0.8, early_stopping = true },
  { id = "beam3_lp100", num_beams = 3, length_penalty = 1.0, early_stopping = true },
  { id = "beam3_lp120", num_beams = 3, length_penalty = 1.2, early_stopping = true },
  { id = "beam5_lp080", num_beams = 5, length_penalty = 0.8, early_stopping = true },
  { id = "beam5_lp100", num_beams = 5, length_penalty = 1.0, early_stopping = true },
  { id = "beam5_lp120", num_beams = 5, length_penalty = 1.2, early_stopping = true },
]

[selection]
primary_metric = "chrf2"
secondary_metric = "bleu"
minimum_repair_chrf2_from_exp4 = 0.30
minimum_macro_chrf2 = 38.35
minimum_worst_chrf2 = 17.07
